name: CI - Django Todo

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop]

jobs:
  pruebas:
    name: Construir y probar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar el proyecto
        run: python manage.py check

      - name: Aplicar migraciones
        run: python manage.py migrate

      - name: Ejecutar pruebas y generar reporte
        shell: bash
        run: |
          echo "REPORTE DE PRUEBAS - Django Todo" > reporte-pruebas.txt
          echo "Rama: ${{ github.ref_name }}" >> reporte-pruebas.txt
          echo "Commit: ${{ github.sha }}" >> reporte-pruebas.txt
          echo "Fecha: $(date)" >> reporte-pruebas.txt
          echo "----------------------------------------" >> reporte-pruebas.txt
          python manage.py test todos -v 2 2>&1 | tee -a reporte-pruebas.txt

      - name: Resumen del pipeline
        if: always()
        shell: bash
        run: |
          echo "## Resultado de las pruebas" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 25 reporte-pruebas.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Publicar el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: reporte-pruebas.txt